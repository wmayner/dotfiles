# ~/.aerospace.toml  (symlinked from ~/dotfiles/aerospace/aerospace-dynamic.toml)
#
# Floating spaces manager: every window floats and is sized via Rectangle.
# Workspaces are pinned to physical monitors BY NAME (not index), so docking
# and undocking are stable. Single mode — no main/desktop switching.
#
# Monitors (from `system_profiler SPDisplaysDataType` / aerospace list-monitors):
#   "LG HDR 4K"  – 5K, physically LEFT
#   "CB272K"     – Acer, portrait, physically RIGHT
#   "Color LCD"  – built-in MacBook display, physically BELOW

start-at-login = true

# Float every window; size/position with the Rectangle keybindings below.
[[on-window-detected]]
run = "layout floating"

# Warp the mouse onto the newly focused monitor so multi-monitor focus tracks
# the cursor (a common source of "focus feels wrong" with several displays).
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ---------- Exec env ----------
[exec.env-vars]
PATH = '${HOME}/dotfiles/aerospace/scripts:${PATH}'
BASH_PATH = '/opt/homebrew/bin/bash'   # Apple Silicon Homebrew bash

# ---------- Workspace -> monitor assignment (by name, laptop fallback) ----------
# Docked: workspaces spread across their named monitors.
# Undocked: any name not currently connected falls back to 'main' (the laptop),
# so everything collapses onto the built-in display — and spreads back on redock.
[workspace-to-monitor-force-assignment]
1 = ['LG HDR 4K', 'main']   # 5K (left)
2 = ['LG HDR 4K', 'main']
3 = ['LG HDR 4K', 'main']
4 = ['CB272K', 'main']      # portrait Acer (right)
5 = ['CB272K', 'main']
6 = ['CB272K', 'main']
7 = ['Color LCD', 'main']   # built-in (below)
8 = ['Color LCD', 'main']
9 = ['Color LCD', 'main']

# ---------- Bindings (single default 'main' mode) ----------
[mode.main.binding]

# Switch to a workspace (jumps to whichever monitor it lives on)
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

# Cycle through workspaces (wraps around). Also driven by the Hammerspoon
# 4-finger trackpad swipe via set-workspace.sh.
ctrl-right = 'workspace --wrap-around next'
ctrl-left  = 'workspace --wrap-around prev'

# Move focused window to a workspace AND follow it there
shift-cmd-1 = ['move-node-to-workspace 1', 'workspace 1']
shift-cmd-2 = ['move-node-to-workspace 2', 'workspace 2']
shift-cmd-3 = ['move-node-to-workspace 3', 'workspace 3']
shift-cmd-4 = ['move-node-to-workspace 4', 'workspace 4']
shift-cmd-5 = ['move-node-to-workspace 5', 'workspace 5']
shift-cmd-6 = ['move-node-to-workspace 6', 'workspace 6']
shift-cmd-7 = ['move-node-to-workspace 7', 'workspace 7']
shift-cmd-8 = ['move-node-to-workspace 8', 'workspace 8']
shift-cmd-9 = ['move-node-to-workspace 9', 'workspace 9']

# Move focused window to a workspace WITHOUT following
shift-cmd-ctrl-1 = 'move-node-to-workspace 1'
shift-cmd-ctrl-2 = 'move-node-to-workspace 2'
shift-cmd-ctrl-3 = 'move-node-to-workspace 3'
shift-cmd-ctrl-4 = 'move-node-to-workspace 4'
shift-cmd-ctrl-5 = 'move-node-to-workspace 5'
shift-cmd-ctrl-6 = 'move-node-to-workspace 6'
shift-cmd-ctrl-7 = 'move-node-to-workspace 7'
shift-cmd-ctrl-8 = 'move-node-to-workspace 8'
shift-cmd-ctrl-9 = 'move-node-to-workspace 9'

# Throw the focused window to another monitor, then maximize it there
cmd-alt-i = [
    'move-node-to-monitor --focus-follows-window left',
    'exec-and-forget open -g "rectangle://execute-action?name=maximize"',
]
cmd-alt-p = [
    'move-node-to-monitor --focus-follows-window right',
    'exec-and-forget open -g "rectangle://execute-action?name=maximize"',
]
cmd-alt-o = [
    'move-node-to-monitor --focus-follows-window next',
    'exec-and-forget open -g "rectangle://execute-action?name=maximize"',
]

# Size the focused (floating) window via Rectangle
ctrl-cmd-o        = 'exec-and-forget open -g "rectangle://execute-action?name=maximize"'
cmd-alt-k         = 'exec-and-forget open -g "rectangle://execute-action?name=left"'
cmd-alt-semicolon = 'exec-and-forget open -g "rectangle://execute-action?name=right"'
cmd-alt-l         = 'exec-and-forget open -g "rectangle://execute-action?name=bottom"'

# Cycle windows of the focused app within the current workspace
cmd-backtick       = 'exec-and-forget ${BASH_PATH} cycle-app-windows-in-workspace.sh next'
cmd-shift-backtick = 'exec-and-forget ${BASH_PATH} cycle-app-windows-in-workspace.sh prev'

# Save / restore floating window layout (handy across dock states)
shift-cmd-ctrl-s = 'exec-and-forget ${BASH_PATH} aerospace-save-restore.sh save'
shift-cmd-ctrl-r = 'exec-and-forget ${BASH_PATH} aerospace-save-restore.sh restore'

# Reload this config
shift-cmd-ctrl-c = 'reload-config'
