<!doctype html>
<!-- Summary figure (Figure 1) for a result from Will's fleet (mats-fleet Q1, 19 October 2026).
     Idea: a circuit written as neurons keeps the output only when the network's true units are neurons.
     Caption (goes under the image, not in it):
     **A circuit written as neurons keeps a network's output only when the network's true units are neurons.**
     We plant a known circuit in hand-built networks, keep only the circuit as neurons, ablate every other neuron
     (resample ablation), and count the bits needed to correct its output to the full network's over 256 prompts per
     task (medians over networks). Top: where the true units are neurons, the circuit needs under 10 bits, against
     about 640 for random neuron sets of the same size (30 networks). Bottom: where the true units are latents stored
     along random directions, the circuit kept in its own directions needs 4 bits, but written as neurons it needs about
     17,000, no better than random neuron sets of its size (about 15,000; 60 networks). The bottom result holds by
     construction, since random directions spread each unit over every neuron: it is a sanity check of the testbed,
     not a discovery. The output bars are schematic. Source: mats-fleet Q1, results_confirm_v1.md and
     results_kind2_gap_v1.md.
     Render: sh ~/.claude/skills/figures/render_html.sh examples/summary_units.html examples/summary_units.png 1600 680 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../summary.css">
<style>
  .canvas { height: 680px; padding: 36px 48px; display: grid; align-items: center; justify-items: center;
            grid-template-columns: 190px 310px 130px 310px 110px 330px 100px; grid-template-rows: 50px 1fr 1fr; row-gap: 10px; column-gap: 0; }
  .row-label { justify-self: end; padding-right: 24px; }
  .rule { grid-column: 1 / -1; width: 100%; border-top: 1.5px solid var(--line); align-self: start; }
</style>
</head><body>
<div class="canvas">
  <div></div>
  <div class="panel-head">Plant a known circuit</div>
  <div></div>
  <div class="panel-head">Keep it as neurons</div>
  <div></div>
  <div class="panel-head" style="grid-column: 6 / 8">Compare the output</div>

  <!-- Row 1: the true units are neurons. The circuit is three neurons. -->
  <div class="row-label">True units:<br>neurons</div>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-on="1.1 1.3 2.2"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-on="1.1 1.3 2.2" data-ablate="1 2"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <div class="out">
    <figure><div class="bars"><div class="bar" style="height:72px"></div><div class="bar" style="height:18px"></div></div><figcaption>full network</figcaption></figure>
    <figure><div class="bars"><div class="bar on" style="height:70px"></div><div class="bar on" style="height:20px"></div></div><figcaption>circuit only</figcaption></figure>
  </div>
  <span class="badge check" data-icon="check"></span>

  <!-- Row 2: the true units are directions spread over every neuron. The same neuron count is kept. -->
  <div class="row-label">True units:<br>directions</div>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-dirs="1 2"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <svg class="net" width="230" height="230" data-layers="3,5,4,2" data-on="1.0 1.3 2.1" data-ablate="1 2" data-dirs="1 2" data-broken="1 2"></svg>
  <span class="arrow" data-icon="arrow"></span>
  <div class="out">
    <figure><div class="bars"><div class="bar" style="height:72px"></div><div class="bar" style="height:18px"></div></div><figcaption>full network</figcaption></figure>
    <figure><div class="bars"><div class="bar on" style="height:14px"></div><div class="bar on" style="height:76px"></div></div><figcaption>circuit only</figcaption></figure>
  </div>
  <span class="badge cross" data-icon="cross"></span>
</div>
<script src="../summary.js"></script>
</body></html>
